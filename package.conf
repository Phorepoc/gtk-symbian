# package.conf -- how the pdk's package.yml would build this repository's SIS files (release.yml). NOT WIRED YET (see README.md): the pdk must resolve ".hildon/..." to
# $PHOREPOC_BUILD/hildon/ and merge the layer's registry file. Until then the SIS files come from Symbian-ReverseEngineered/tools/hildon_sis.py (same files, same dependencies); recipes/sis.sh is the pdk form.
NAME=gtk-symbian
ARCHES="x32"
IMAGE=ghcr.io/phorepoc/web
REPOS_x32="cxxrt glib-symbian"
COMPONENTS_x32="phepixman phefreetype phehb phepng phefontconfig phecairo phepango phepixbuf pheatk phegdk phegtk"
